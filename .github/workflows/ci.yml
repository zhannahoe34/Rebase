name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run baml-cli generate
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # LLM tests skip without REBASE_ANTHROPIC_API_KEY and show as SKIPPED (not run), never as passed.
      - run: uv run pytest -rs
